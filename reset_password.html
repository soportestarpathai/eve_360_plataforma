<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | Investor Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #0B3C8A;
            --primary-dark: #0B486B;
            --primary-light: rgba(11, 60, 138, 0.08);
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #f8fafc 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .reset-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.03);
            overflow: hidden;
        }
        .reset-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 32px 40px;
            text-align: center;
        }
        .reset-header h1 { font-size: 1.35rem; font-weight: 600; color: #fff; margin: 0; letter-spacing: 0.3px; }
        .reset-header p { font-size: 0.85rem; color: rgba(255,255,255,0.9); margin: 6px 0 0 0; }
        .reset-body { padding: 36px 40px 40px; }
        .form-label { font-weight: 600; color: #1e293b; font-size: 0.9rem; }
        .form-control {
            border-radius: 12px;
            padding: 14px 18px;
            border: 1.5px solid #e2e8f0;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .input-group .form-control { border-left: 0; border-radius: 0 12px 12px 0; }
        .input-group-text {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-right: 0;
            border-radius: 12px 0 0 12px;
            color: #64748b;
        }
        .btn-reset {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 14px rgba(11, 60, 138, 0.3);
        }
        .btn-reset:hover {
            background: linear-gradient(135deg, #0a366d 0%, #0a3f5c 100%);
            box-shadow: 0 6px 20px rgba(11, 60, 138, 0.35);
        }
        .msg-success { padding: 12px 16px; border-radius: 12px; background: #ecfdf5; color: #065f46; font-weight: 500; }
        .msg-error { padding: 12px 16px; border-radius: 12px; background: #fef2f2; color: #991b1b; font-weight: 500; }
        .back-link { color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .back-link:hover { color: var(--primary-dark); }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 p-3">

    <div id="mainCard" class="reset-card" style="max-width: 440px; width: 100%;">
        <div class="reset-header">
            <h1><i class="fa-solid fa-shield-halved me-2"></i>Investor Security</h1>
            <p>Establece tu nueva contraseña</p>
        </div>
        <div class="reset-body">
            <form id="resetForm">
                <label class="form-label">Nueva contraseña</label>
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="newPass" class="form-control" placeholder="Mínimo 4 caracteres" required minlength="4" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-reset w-100 mt-2">
                    <i class="fa-solid fa-check me-2"></i>Actualizar contraseña
                </button>
            </form>
            <div id="msg" class="mt-3"></div>
            <p class="mt-4 mb-0 text-center">
                <a href="login.php" class="back-link"><i class="fa-solid fa-arrow-left me-1"></i>Volver al inicio de sesión</a>
            </p>
        </div>
    </div>

    <div id="invalidToken" class="reset-card text-center py-5 px-4" style="max-width: 440px; display: none;">
        <i class="fa-solid fa-circle-xmark text-danger mb-3" style="font-size: 3rem;"></i>
        <h4 class="mb-2">Token inválido o expirado</h4>
        <p class="text-muted mb-4">Solicita un nuevo enlace para restablecer tu contraseña.</p>
        <a href="login.php" class="btn btn-primary btn-reset">Ir al inicio de sesión</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('invalidToken').style.display = 'block';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type=submit]');
            const msgEl = document.getElementById('msg');
            const password = document.getElementById('newPass').value;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Actualizando...';
            msgEl.innerHTML = '';

            const res = await fetch('api/auth_reset.php', {
                method: 'POST',
                body: JSON.stringify({ token, password })
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                msgEl.innerHTML = '<div class="msg-success"><i class="fa-solid fa-check-circle me-2"></i>Contraseña actualizada. Redirigiendo...</div>';
                setTimeout(() => window.location.href = 'login.php', 2000);
            } else {
                msgEl.innerHTML = '<div class="msg-error"><i class="fa-solid fa-exclamation-circle me-2"></i>' + (data.message || 'Error') + '</div>';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check me-2"></i>Actualizar contraseña';
            }
        });
    </script>
</body>
</html>
